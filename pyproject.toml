[project]
name = "secretscan-mcp"
version = "0.1.0"
description = "MCP server that finds accidentally committed secrets in a working tree and in git history, with redaction by design: raw secret values never appear in any output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]
keywords = ["mcp", "secrets", "security", "git", "secret-scanning", "credentials", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/secretscan-mcp"

[project.scripts]
secretscan-mcp = "secretscan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secretscan_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
